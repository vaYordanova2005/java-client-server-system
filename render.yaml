services:
  # Spring Boot API
  - type: web
    name: markly-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Existing Neon Postgres — fill these in via the Render dashboard
      # (Environment tab), not here, so credentials never touch git.
      # Split them out of your Neon connection string:
      #   postgres://USER:PASSWORD@HOST/DBNAME?sslmode=require
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      # Must exactly match the frontend's origin (scheme + host, no trailing
      # slash) or the browser's CORS preflight will fail. Render only knows
      # the frontend's URL after it's been created once, so this starts as a
      # placeholder — update it in the dashboard after the first deploy and
      # redeploy the backend.
      - key: FRONTEND_ORIGIN
        value: https://markly-frontend.onrender.com
      # NOTE: Render assigned this backend service the hostname
      # markly-backend-w80o.onrender.com (a random suffix) because the plain
      # "markly-backend" name was already reserved by a stale/broken service.
      # Keep VITE_API_BASE_URL below and the actual dashboard values in sync
      # with whatever hostname Render reports as the "primary URL" in the
      # deploy log after a fresh service creation.
      # The session cookie is httpOnly and, because the SPA lives on another
      # host, cross-site — which browsers only accept as SameSite=None; Secure.
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: None

  # React (Vite) SPA
  - type: web
    name: markly-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Same placeholder situation as FRONTEND_ORIGIN above: this must point
      # at the backend's real URL, which is only known after the backend
      # service is created. Vite bakes env vars in at build time, so after
      # updating this, trigger a manual redeploy (not just a restart).
      - key: VITE_API_BASE_URL
        value: https://markly-backend-w80o.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
