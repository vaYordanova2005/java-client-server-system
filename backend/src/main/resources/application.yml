spring:
  application:
    name: backend
  main:
    # Free-tier hosts (e.g. Render) throttle CPU hard enough that eager bean
    # init can push Tomcat's actual listen-start past the platform's
    # port-scan timeout. Lazy init defers non-essential beans to first use,
    # cutting context startup time.
    #
    # WARNING: this is a global switch, not a targeted fix. It is safe today
    # because nothing in the app is @Scheduled/@EventListener/@PostConstruct
    # (a bean nobody ever injects or looks up is never instantiated at all,
    # so its side effects silently never run — no error, no log). The first
    # such bean added later needs either an explicit `@Lazy(false)`/
    # `ApplicationRunner`-style eager trigger, or this flag should be swapped
    # for a narrower fix (e.g. `spring.jmx.enabled: false` plus disabling the
    # specific slow autoconfigurations) before it's added.
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:markly}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

spring.servlet.multipart:
  # Only the admin CSV bulk-import endpoint accepts file uploads, and its
  # rows are plaintext username/password lines — a few hundred KB is
  # generous. Spring Boot's own default (1MB/file, 10MB/request) is small
  # enough that an admin importing a large-but-legitimate roster could hit
  # it and get a raw MaxUploadSizeExceededException -> 500 instead of the
  # friendly per-row error the endpoint is meant to give.
  max-file-size: 2MB
  max-request-size: 2MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  security:
    # Networks (comma-separated CIDRs) occupied by the proxies in front of the
    # app; their entries are skipped when reading the client address from
    # X-Forwarded-For. Empty is right for Render on its own — it appends
    # exactly one entry. Add a CDN's ranges here when one is put in front.
    trusted-proxies: ${TRUSTED_PROXIES:}
  auth:
    cookie:
      # The SPA and the API are separate origins in production, so the session
      # cookie has to be SameSite=None (and therefore Secure) there; locally
      # over plain http it must stay Lax, since browsers drop Secure cookies
      # on http://localhost's cross-origin requests.
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  seed-admin:
    username: ${SEED_ADMIN_USERNAME:admin}
    password: ${SEED_ADMIN_PASSWORD}
  seed-demo-data:
    enabled: ${SEED_DEMO_DATA:false}

cors:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
