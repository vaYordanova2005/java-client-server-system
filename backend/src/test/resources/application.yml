spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:markly-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 0

spring.servlet.multipart:
  max-file-size: 2MB
  max-request-size: 2MB

app:
  jwt:
    secret: test-only-secret-must-be-at-least-32-bytes-long
    expiration-minutes: 480
  security:
    trusted-proxies:
  auth:
    cookie:
      secure: false
      same-site: Lax
  seed-admin:
    username: admin
    password: Seed-Parola2024
  seed-demo-data:
    enabled: false

cors:
  allowed-origin: http://localhost:5173
